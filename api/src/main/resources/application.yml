# Defaults batem com o docker-compose local: quem roda nativo não precisa exportar nada.
# Em container/AWS, tudo é sobrescrito por variáveis de ambiente.
server:
  port: ${PORT:8080}
spring:
  application:
    name: sisgares-api
  autoconfigure:
    # Sem login por formulário/basic: evita o usuário padrão com senha aleatória no log (modo simulado).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    # Sem SPRING_PROFILES_ACTIVE (dev nativo) => local + seed. Na AWS, definir explicitamente.
    default: local,seed
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sisgares}
    username: ${DB_USER:sisgares}
    password: ${DB_PASSWORD:sisgares_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: America/Fortaleza
  flyway:
    enabled: true
  jackson:
    time-zone: America/Fortaleza
app:
  auth:
    # simulado (padrão): usuário pelo header X-Usuario-Id, SOMENTE com o profile "local" (a API não sobe sem ele).
    # cognito: exige JWT (ID token) do user pool; o header é ignorado. Exige AUTH_ISSUER_URI e AUTH_CLIENT_ID.
    modo: ${AUTH_MODO:simulado}
    # Ex.: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX (saída IssuerUri de infra/cognito.yaml)
    issuer-uri: ${AUTH_ISSUER_URI:}
    client-id: ${AUTH_CLIENT_ID:}
  snp:
    endpoint: ${SNP_ENDPOINT:http://localhost:8080/mock-snp/pedidos}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  # Leitura dos CSV de seed (classpath:seed/*.csv) deve usar UTF-8 explícito.
  seed:
    charset: UTF-8
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
