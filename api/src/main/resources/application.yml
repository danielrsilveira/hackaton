# Defaults batem com o docker-compose local: quem roda nativo não precisa exportar nada.
# Em container/AWS, tudo é sobrescrito por variáveis de ambiente.
server:
  port: ${PORT:8080}
spring:
  application:
    name: sisgares-api
  profiles:
    # Sem SPRING_PROFILES_ACTIVE (dev nativo) => local + seed. Na AWS, definir explicitamente.
    default: local,seed
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sisgares}
    username: ${DB_USER:sisgares}
    password: ${DB_PASSWORD:sisgares_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: America/Fortaleza
  flyway:
    enabled: true
  jackson:
    time-zone: America/Fortaleza
app:
  snp:
    endpoint: ${SNP_ENDPOINT:http://localhost:8080/mock-snp/pedidos}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  # Leitura dos CSV de seed (classpath:seed/*.csv) deve usar UTF-8 explícito.
  seed:
    charset: UTF-8
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
