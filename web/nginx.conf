server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API e SNP simulado: mesmo papel do comportamento /api/* do CloudFront.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
    location /mock-snp/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Configuração de runtime (gerada no start do container): nunca em cache.
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    # (add_header em um location substitui os do server, por isso os de segurança se repetem.)
    location ~* \.(?:js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Rotas do Angular (SPA).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }
}
